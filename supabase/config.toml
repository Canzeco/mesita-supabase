# Supabase project config — Mesita
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "yjalywfzdelacdzccpgb"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# MFA — required only for admin sign-in, kept available so businesses can
# enrol if they want. Admin-side enforcement lives in admin-signin-email.
enable_manual_linking = false

# Email — password only. No magic link, no email OTP. Consumers don't get
# email auth at all; business + admin live here.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Phone — Twilio Verify, Mexico template at signup. Consumers + staff sign
# in here; businesses + admins never see this provider.
[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your Mesita code is {{ .Code }}"
max_frequency = "60s"

[auth.sms.twilio]
enabled = true
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"

# OAuth providers — all explicitly disabled. Spec: no Google, no Apple.
[auth.external.google]
enabled = false

[auth.external.apple]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = true
port = 54327
backend = "postgres"

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"

# Per-function overrides. Naming rule: <caller>-<verb>-<noun> (e.g.
# business-web-create-project, consumer-list-tickets). All functions verify the
# JWT except the truly public catalog reads, which rely on RLS to gate
# visibility instead.

# --- Sign-in / accept-invite (post-signin housekeeping per role) ---
#
# These run AFTER the Supabase Auth call lands a session. They set
# app_metadata.role, create the corresponding profile row, and (admin)
# enforce @canzeco.com + MFA. verify_jwt = true gates each to a real
# session.

[functions.business-web-signin-email]
verify_jwt = true

[functions.consumer-web-signin-phone]
verify_jwt = true

[functions.business-web-accept-invite]
verify_jwt = true

# Internal-only (artificial caller). verify_jwt = true so the gateway verifies
# the service_role JWT signature; requireInternalCaller then checks role=service_role.
[functions.enricher-agent-discover-places]
verify_jwt = true

# Persist half of the create pipeline — INSERTs the minimal Google-basics profile
# as places + units rows (shared PK, status='active'), with a caller-supplied
# content_status (async create → 'generating'), idempotent on google_place_id.
# Internal-only; the create/schedule callers invoke it with the service-role bearer.
[functions.enricher-agent-save-place-data]
verify_jwt = true

# UPDATE half of the ASYNC enrich pipeline — writes the enriched profile onto the
# existing places/units row (UPDATE by id; flips content_status → 'ready'/'failed').
# Internal-only; invoked by the n8n Enricher with the service-role bearer.
[functions.enricher-agent-write-place-data]
verify_jwt = true

# Read-only init endpoint for the n8n Enricher — returns { config, categories[],
# tags[] } (Atlas knobs + closed category/tag vocabularies). Internal-only;
# invoked by the n8n Enricher once at workflow start with the service-role bearer.
[functions.enricher-agent-get-config]
verify_jwt = true

# Async media persistence worker — stores source metadata immediately and mirrors
# source images to Supabase Storage in background. Internal-only.
[functions.enricher-agent-store-place-images]
verify_jwt = true

# Per-step progress beacon for the n8n Enricher — INSERTs one
# place_enrichment_events row per pipeline step (feeds the admin console
# notifications). Internal-only; invoked by the n8n Enricher leaf branches
# with the service-role bearer.
[functions.enricher-agent-report-step]
verify_jwt = true

# --- Enricher v2 pipeline (the Enricher is a PROCESS: cron-driven stages) ---
#
# Three stage EFs walk a place_research row research → analysis → contents.
# The pg_cron poller (run_place_enrichment_stages) claims pending rows and
# fires one net.http_post per row with the Vault service-role bearer; each EF
# acks immediately and works in an EdgeRuntime background task. Internal-only.
[functions.supabase-cron-enrich-place-research]
verify_jwt = true

[functions.supabase-cron-enrich-place-analysis]
verify_jwt = true

[functions.supabase-cron-enrich-place-contents]
verify_jwt = true

# LIVE admin create path — seeds the minimal 'generating' place via
# enricher-agent-save-place-data and hands deep enrichment to the n8n Enricher
# (fire-and-forget webhook). Operator JWT + super_admins allowlist.
[functions.admin-web-create-unit]
verify_jwt = true

# Authed consumer writes / reads tied to the signed-in consumer's own data.
# Public catalog reads. RLS enforces which place statuses are visible.
[functions.consumer-web-list-places]
verify_jwt = false

[functions.consumer-web-get-place]
