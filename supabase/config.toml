# --- Admin (Supabase Auth + super_admins allowlist) ---
#
# Operators sign in as themselves (Google OAuth via the admin web).
# Each EF re-checks the caller's JWT email against public.super_admins
# before doing anything privileged.

# Tiny session-check used by the admin + business app shells.
[functions.auth-get-identity]
verify_jwt = true

# Ownership-verification queue surface for super-admins.
[functions.admin-list-verifications]
verify_jwt = true

# Global Performance notifications feed for super-admins (derived,
# non-realtime — the console pulls it on Refresh).
[functions.admin-list-notifications]
verify_jwt = true

[functions.admin-decide-verification]
verify_jwt = true

[functions.admin-set-auto-verify]
verify_jwt = true

[functions.admin-get-atlas-fields]
verify_jwt = true

# Bulk Google Places Text Search proxy. Many queries in, deduped
# Place IDs out.
[functions.admin-discover-places]
verify_jwt = true

# Google Places autocomplete for Create Single Unit (admin console).
[functions.admin-suggest-places]
verify_jwt = true

# Resolve a Google Place ID to a Mesita place. Powers the admin
# console's "open in business" link generator.
[functions.admin-find-place]
verify_jwt = true

# Super-admin free-text place search (name / slug / id) for the admin
# console's Manage Single Unit place picker.
[functions.admin-search-places]
verify_jwt = true

# DESTRUCTIVE full reset. Gated on super_admins + a typed "RESET"
# confirmation. Wipes all data, keeps the super-admin allowlist.
[functions.admin-reset-database]
verify_jwt = true

# Super-admin allowlist management (public.super_admins). Each re-checks
# super_admins on the caller. Powers the Admin Configuration
# "Add/remove admins" card.
[functions.admin-list-admins]
verify_jwt = true

[functions.admin-grant-admin]
verify_jwt = true

[functions.admin-revoke-admin]
verify_jwt = true

# Atlas configuration — place research/enrichment knobs on app_settings,
# owned by admins.
[functions.admin-get-settings]
verify_jwt = true

[functions.admin-update-atlas-config]
verify_jwt = true

# Re-run the profile enricher on an existing place (super-admin only).
[functions.consumer-create-subscription]
verify_jwt = true

[functions.stripe-handle-webhook]
